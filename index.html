<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEAD CHARM — Натуральне каміння</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #bfa046;
            --dark: #1a1a1a;
            --light-bg: #f5f2ed; /* Бежевий фон */
            --gray: #888;
            --border: #e0ddd7;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--light-bg); 
            color: var(--dark); 
            overflow-x: hidden; 
        }

        /* HEADER */
        header {
            position: sticky; top: 0; background: white; z-index: 1000;
            padding: 20px; border-bottom: 1px solid var(--border);
            text-align: center; display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .logo { 
            font-family: 'Playfair Display'; 
            font-size: clamp(32px, 10vw, 52px); 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin: 0; 
            font-weight: 600;
        }
        .slogan-top { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        
        .cart-btn { 
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%); 
            cursor: pointer; font-size: 20px; background: none; border: none; padding: 10px;
            display: flex; align-items: center; gap: 5px;
        }
        #count { color: var(--gold); font-weight: 600; }

        /* HERO З ОНОВЛЕНИМ СЛОГАНОМ */
        .hero {
            height: 50vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1200&q=80') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .hero-text {
            max-width: 800px;
        }
        .hero-text p {
            font-family: 'Playfair Display';
            font-size: clamp(20px, 5vw, 36px);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.4;
            margin: 0;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.6);
        }

        /* FILTERS */
        .filters { display: flex; justify-content: center; gap: 8px; padding: 25px 20px; flex-wrap: wrap; }
        .filters button { 
            padding: 8px 18px; border: 1px solid #d1cdb8; border-radius: 20px; 
            background: white; cursor: pointer; transition: 0.2s; font-size: 13px;
        }
        .filters button.active { background: var(--dark); color: white; border-color: var(--dark); }

        /* PRODUCTS */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px; padding: 0 20px 40px 20px; max-width: 1200px; margin: 0 auto;
        }
        @media (min-width: 768px) { .products { gap: 30px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); } }

        .card { 
            border-radius: 12px; overflow: hidden; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.05); 
            transition: 0.3s; background: #fff; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
        @media (min-width: 768px) { .card img { height: 320px; } }

        .card-info { padding: 15px; text-align: center; flex-grow: 1; }
        .card h4 { margin: 0 0 8px 0; font-family: 'Playfair Display'; font-size: 18px; }
        .price { color: var(--gold); font-weight: 600; font-size: 1.1em; }

        .btn-group { display: flex; gap: 5px; padding: 15px; }
        .card button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .add-btn { background: #f0ede6; color: var(--dark); }
        .buy-now { background: var(--dark); color: white; }

        /* MODAL */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .modal.show { display: flex; }
        .modal-content { 
            background: white; padding: 25px; border-radius: 15px; max-width: 500px; width: 100%; 
            max-height: 90vh; overflow-y: auto;
        }

        #mDesc { 
            white-space: pre-line; 
            color: #444; 
            font-size: 13px; 
            line-height: 1.6; 
            margin: 15px 0; 
            padding: 15px; 
            background: #f9f7f2; 
            border-radius: 10px; 
        }

        .size-selector { margin: 15px 0; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .size-label { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: block; }
        .size-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .size-btn { 
            padding: 8px 14px; border: 1px solid #ddd; background: white; border-radius: 6px; 
            cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .size-btn.selected { background: var(--dark); color: white; border-color: var(--dark); }

        .modal-gallery { display: flex; gap: 10px; margin: 15px 0; overflow-x: auto; padding-bottom: 5px; }
        .modal-gallery img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }

        /* CART */
        .cart {
            position: fixed; right: 0; top: 0; width: 100%; max-width: 380px;
            height: 100%; background: white; z-index: 3000;
            transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }
        .cart.open { transform: translateX(0); }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .cart-body { flex: 1; overflow-y: auto; padding: 20px; }
        
        .qty-control { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ddd; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: #fdfdfd; }
        .order-form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .order-form input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; }
        
        .cart-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .order-btn { background: var(--gold); color: white; border: none; padding: 16px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; font-size: 16px; }
        .continue-btn { background: #f0ede6; color: var(--dark); border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 500; cursor: pointer; }
    </style>
</head>

<body>

<header>
    <div class="slogan-top">Натуральне каміння – ручна робота</div>
    <h1 class="logo">BEAD CHARM</h1>
    <button class="cart-btn" onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
</header>

<div class="hero">
    <div class="hero-text">
        <p>ПРИКРАСИ, ЩО МАЮТЬ ДУШУ ТА ОСОБЛИВУ ЕНЕРГІЮ</p>
    </div>
</div>

<div class="filters">
    <button onclick="filterCategory('all', this)" class="active">Усі</button>
    <button onclick="filterCategory('bracelets', this)">Браслети</button>
    <button onclick="filterCategory('earrings', this)">Сережки</button>
    <button onclick="filterCategory('rings', this)">Кільця</button>
</div>

<div class="products" id="products"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <h3 id="mTitle" style="font-family:'Playfair Display'; margin-top: 0; font-size: 24px;"></h3>
        <img id="mImg" style="width:100%; border-radius:10px; height:320px; object-fit:cover;">
        <div id="mGallery" class="modal-gallery"></div>
        
        <div class="size-selector" id="mSizeBlock">
            <span class="size-label">Оберіть розмір:</span>
            <div class="size-options" id="mSizes"></div>
        </div>

        <div id="mDesc"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <h4 id="mPrice" style="color:var(--gold); font-size:26px; margin: 0;"></h4>
            <button onclick="addToCart()" style="padding:14px 28px; background:var(--dark); color:white; border:none; border-radius:10px; cursor:pointer; font-weight: 600;">У кошик</button>
        </div>
    </div>
</div>

<!-- CART -->
<div class="cart" id="cart">
    <div class="cart-header">
        <h3 style="font-family:'Playfair Display'; margin:0;">Кошик</h3>
        <button onclick="toggleCart()" style="background:none; border:none; font-size:24px; cursor:pointer; color: #aaa;">✕</button>
    </div>
    <div class="cart-body">
        <div id="cartItems"></div>
        <div id="emptyCartMsg" style="text-align:center; padding:40px; color:#bbb; font-style: italic;">
            <p>Ваш кошик порожній...</p>
            <button class="continue-btn" onclick="toggleCart()">Продовжити покупки</button>
        </div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display: none;">
        <div style="display:flex; justify-content: space-between; font-weight:600; font-size: 20px; margin-bottom:15px;">
            <span>Разом:</span>
            <span><span id="totalPrice">0</span> грн</span>
        </div>
        <div class="order-form">
            <input type="text" placeholder="ПІБ отримувача" id="userName">
            <input type="tel" placeholder="Номер телефону" id="userPhone">
            <input type="text" placeholder="Місто доставки" id="userCity">
            <input type="text" placeholder="Відділення Нової Пошти" id="userPost">
            <div class="cart-btns">
                <button class="order-btn" onclick="sendOrder()">Замовити через Telegram</button>
                <button class="continue-btn" onclick="toggleCart()">Продовжити покупки</button>
            </div>
        </div>
    </div>
</div>

<script>
const data = [
    {
        id: 1,
        name: "Браслет 'Кошаче око'",
        price: 350,
        sizes: ["16 см", "17 см", "18 см", "19 см", "20 см"],
        desc: `Ніжний браслет із каменю «Кошаче око» з підвіскою журавля

Елегантний браслет заворожує своїм м'яким сяйвом та глибиною відтінків. Його гладкі намистини грають на світлі, створюючи ефект таємничого світіння, який додає образу особливої витонченості.

Витончена підвіска у вигляді журавля символізує свободу, надію та виконання бажань.

Вважається, що камінь «Кошаче око»:
• захищає від негативної енергії
• посилює інтуїцію
• допомагає зберігати внутрішню рівновагу
• залучає удачу та гармонію

Характеристики:
• Матеріал: камінь «Кошаче око»
• Декор: підвіска «журавель»
• Розмір намистини: 10 мм
• Тип застібки: замок`,
        category: "bracelets",
        images: ["img/leleka-1.jpeg", "img/leleka-2.jpeg", "img/leleka-3.jpeg", "img/leleka-4.jpeg", "img/leleka-5.jpeg", "img/leleka-6.jpeg", "img/leleka-7.jpeg"]
    }
];

// Авто-генерація інших товарів
for(let i=2; i<=8; i++) {
    const cat = i < 5 ? "bracelets" : i < 7 ? "earrings" : "rings";
    data.push({
        id: i,
        name: (cat === "bracelets" ? "Браслет" : cat === "earrings" ? "Сережки" : "Кільце") + " Handmade №" + i,
        price: 240 + (i * 10),
        sizes: cat === "bracelets" ? ["16 см", "17 см", "18 см", "19 см", "20 см"] : null,
        desc: "Ексклюзивна прикраса ручної роботи з натуральних матеріалів. Виконана з любов'ю та увагою до деталей.",
        category: cat,
        images: [`https://picsum.photos/500/600?random=${i}`]
    });
}

let cartData = [];
let currentProductIndex = null;
let selectedSize = null;

function loadProducts(cat = "all") {
    const container = document.getElementById("products");
    container.innerHTML = "";
    data.forEach((p, index) => {
        if (cat !== "all" && p.category !== cat) return;
        container.innerHTML += `
            <div class="card" onclick="openModal(${index})">
                <img src="${p.images[0]}" onerror="this.src='https://via.placeholder.com/300x300?text=BEAD+CHARM'">
                <div class="card-info">
                    <h4>${p.name}</h4>
                    <div class="price">${p.price} грн</div>
                </div>
                <div class="btn-group">
                    <button class="add-btn" onclick="event.stopPropagation(); openModal(${index})">Огляд</button>
                    <button class="buy-now" onclick="event.stopPropagation(); addQuick(${index})">Купити</button>
                </div>
            </div>`;
    });
}

function openModal(index) {
    currentProductIndex = index;
    const p = data[index];
    selectedSize = p.sizes ? p.sizes[2] : null; 

    document.getElementById("mTitle").innerText = p.name;
    document.getElementById("mImg").src = p.images[0];
    document.getElementById("mDesc").innerText = p.desc;
    document.getElementById("mPrice").innerText = p.price + " грн";
    
    const sizeBlock = document.getElementById("mSizeBlock");
    const sizeContainer = document.getElementById("mSizes");
    sizeContainer.innerHTML = "";
    
    if (p.sizes) {
        sizeBlock.style.display = "block";
        p.sizes.forEach(size => {
            const btn = document.createElement("button");
            btn.className = "size-btn" + (size === selectedSize ? " selected" : "");
            btn.innerText = size;
            btn.onclick = () => {
                selectedSize = size;
                document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
            };
            sizeContainer.appendChild(btn);
        });
    } else {
        sizeBlock.style.display = "none";
    }

    const gallery = document.getElementById("mGallery");
    gallery.innerHTML = "";
    p.images.forEach(imgSrc => {
        const img = document.createElement("img");
        img.src = imgSrc;
        img.onclick = (e) => { e.stopPropagation(); document.getElementById("mImg").src = imgSrc; };
        gallery.appendChild(img);
    });
    document.getElementById("modal").classList.add("show");
}

function closeModal() { document.getElementById("modal").classList.remove("show"); }
function toggleCart() { document.getElementById("cart").classList.toggle("open"); }

function addQuick(index) {
    const p = data[index];
    add(index, p.sizes ? p.sizes[2] : null);
    toggleCart();
}

function add(index, size) {
    const p = data[index];
    const itemKey = p.id + (size ? "_" + size : "");
    const exist = cartData.find(item => item.key === itemKey);
    
    if(exist) {
        exist.qty++;
    } else {
        cartData.push({...p, key: itemKey, selectedSize: size, qty: 1});
    }
    updateCartUI();
}

function changeQty(idx, delta) {
    cartData[idx].qty += delta;
    if (cartData[idx].qty < 1) cartData.splice(idx, 1);
    updateCartUI();
}

function addToCart() {
    add(currentProductIndex, selectedSize);
    closeModal();
    toggleCart();
}

function updateCartUI() {
    const list = document.getElementById("cartItems");
    const footer = document.getElementById("cartFooter");
    const empty = document.getElementById("emptyCartMsg");
    list.innerHTML = "";
    let total = 0, count = 0;
    
    cartData.forEach((item, idx) => {
        total += item.price * item.qty;
        count += item.qty;
        list.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f0ede6;">
                <div>
                    <div style="font-weight:600; font-size:15px;">${item.name}</div>
                    <div style="font-size:12px; color:var(--gray);">${item.selectedSize ? "Розмір: " + item.selectedSize : ""}</div>
                    <div style="color:var(--gold); font-size:14px; margin-top:3px;">${item.price} грн</div>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
                        <span style="font-weight:600;">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                    </div>
                </div>
                <button onclick="cartData.splice(${idx},1); updateCartUI();" style="border:none; background:none; color:#bbb; cursor:pointer; font-size:20px;">✕</button>
            </div>`;
    });
    
    document.getElementById("count").innerText = count;
    document.getElementById("totalPrice").innerText = total;
    footer.style.display = cartData.length ? "block" : "none";
    empty.style.display = cartData.length ? "none" : "block";
}

function sendOrder() {
    const n = document.getElementById("userName").value.trim();
    const p = document.getElementById("userPhone").value.trim();
    if(!n || !p) return alert("Вкажіть ПІБ та телефон!");
    
    let msg = `🛍️ ЗАМОВЛЕННЯ BEAD CHARM:%0A👤 Клієнт: ${n}%0A📞 Тел: ${p}%0A📍 Адреса: ${document.getElementById("userCity").value}, ${document.getElementById("userPost").value}%0A%0A📦 ТОВАРИ:%0A`;
    cartData.forEach(i => {
        msg += `• ${i.name} ${i.selectedSize ? "(" + i.selectedSize + ")" : ""} (x${i.qty}) — ${i.price * i.qty} грн%0A`;
    });
    msg += `%0A💰 СУМА: ${document.getElementById("totalPrice").innerText} грн`;
    
    window.open(`https://t.me/share/url?url=${msg}`);
}

function filterCategory(cat, btn) {
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadProducts(cat);
}

loadProducts();
</script>
</body>
</html>
